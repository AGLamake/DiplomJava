<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">
    <!-- Диалог завершения выезда ГБР; owner — AlarmsBean или MyDispatchesBean -->
    <p:dialog widgetVar="completeDlg" header="Завершение выезда" modal="true" resizable="false" appendTo="@(body)">
        <h:form id="completeForm">
            <div class="form-grid">
                <p:outputLabel for="result" value="Результат"/>
                <p:selectOneMenu id="result" value="#{owner.completion.result}">
                    <f:selectItem itemLabel="— выберите —" itemValue="#{null}" noSelectionOption="true"/>
                    <f:selectItems value="#{owner.completion.results}" var="r" itemLabel="#{r.title()}"
                                   itemValue="#{r}"/>
                </p:selectOneMenu>
                <p:outputLabel for="notes" value="Примечание"/>
                <p:inputTextarea id="notes" value="#{owner.completion.notes}" rows="3" autoResize="false"/>
            </div>
            <div class="dialog-buttons">
                <p:commandButton value="Сохранить" action="#{owner.complete}" update="@form :tableForm"
                                 oncomplete="if (args &amp;&amp; args.saved) PF('completeDlg').hide()"/>
                <p:commandButton value="Отмена" type="button" styleClass="ui-button-secondary"
                                 onclick="PF('completeDlg').hide()"/>
            </div>
        </h:form>
    </p:dialog>
</ui:composition>
